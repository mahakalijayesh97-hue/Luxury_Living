version: '3.8'

services:
  backend:
    build:
      context: ./Luxury_Living_Backend
      dockerfile: Dockerfile
    container_name: luxury_living_backend_prod
    ports:
      - "1337:1337"
    env_file:
      - ./Luxury_Living_Backend/.env
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: sqlite
      DATABASE_FILENAME: .tmp/data.db
    # Notice: NO local volumes mapped here! It uses the copied files from the image.
    command: npm run start
    restart: unless-stopped

  frontend:
    build:
      context: ./project
      dockerfile: Dockerfile
    container_name: luxury_living_frontend_prod
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:1337
    # Notice: NO local volumes mapped here either.
    command: npm run preview -- --host
    depends_on:
      - backend
    restart: unless-stopped
