version: '3.8'

services:

  backend:
    build:
      context: ./Luxury_Living_Backend
      dockerfile: Dockerfile

    container_name: luxury_living_backend

    ports:
      - "1337:1337"

    env_file:
      - ./Luxury_Living_Backend/.env

    environment:
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: sqlite
      DATABASE_FILENAME: .tmp/data.db

    volumes:
      - ./Luxury_Living_Backend:/app
      - backend_node_modules:/app/node_modules

    command: npm run develop

    restart: unless-stopped


  frontend:
    build:
      context: ./project
      dockerfile: Dockerfile

    container_name: luxury_living_frontend

    ports:
      - "5173:5173"

    environment:
      VITE_API_URL: http://localhost:1337

    volumes:
      - ./project:/app
      - frontend_node_modules:/app/node_modules

    command: npm run dev -- --host

    depends_on:
      - backend

    restart: unless-stopped


volumes:
  backend_node_modules:
  frontend_node_modules:
  sqlite_data: